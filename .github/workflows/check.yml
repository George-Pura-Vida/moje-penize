name: Check MySQL installation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: moje_penize_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Modelation frontend contract
        run: node tests/modelation_frontend.js
      - name: CE-1.0.0 calculation engine, fixtures T01-T15 and HTTP contract
        run: |
          php tests/calculation_engine.php
          php tests/ce_fixtures.php
          php tests/ce_http.php
      - name: Initialization, retry, health and public lock
        env:
          TEST_DB_PASSWORD: disposable-ci-password
        run: python3 tests/install_smoke.py
